<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clube da Pizza - CasadasPizzaass</title>
    <meta name="theme-color" content="#e74c3c">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #0d0d0d;
            color: #fff;
            min-height: 100vh;
        }

        /* HEADER */
        .topo {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 20px;
            background: #111;
            border-bottom: 3px solid #e74c3c;
        }
        .topo a {
            color: #fff;
            text-decoration: none;
            background: rgba(255,255,255,0.1);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
        }
        .topo h1 { font-size: 1.2rem; color: #e74c3c; }

        /* CONTEUDO */
        .conteudo {
            padding: 24px 16px 40px;
            max-width: 900px;
            margin: 0 auto;
        }
        .titulo {
            text-align: center;
            font-size: 1.5rem;
            color: #ffd700;
            margin-bottom: 6px;
        }
        .subtitulo {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        /* PLANOS */
        .planos {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: #1a1a1a;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid #333;
        }
        .card.popular {
            border-color: #e74c3c;
            box-shadow: 0 0 20px rgba(231,76,60,0.2);
        }
        .tag-popular {
            background: #e74c3c;
            color: #fff;
            text-align: center;
            padding: 6px;
            font-size: 0.75rem;
            font-weight: 800;
        }
        .card-topo {
            padding: 18px 20px;
            text-align: center;
            color: #fff;
        }
        .bg-basico { background: linear-gradient(135deg, #667eea, #764ba2); }
        .bg-premium { background: linear-gradient(135deg, #e74c3c, #ff6b35); }
        .bg-familia { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .bg-vip { background: linear-gradient(135deg, #f7971e, #ffd200); }
        .card-topo span { font-size: 1.8rem; }
        .card-topo h3 { margin-top: 6px; font-size: 1.15rem; }
        .card-corpo { padding: 20px; }
        .preco { text-align: center; margin-bottom: 16px; }
        .preco b { font-size: 2rem; color: #e74c3c; }
        .card.popular .preco b { color: #ffd700; }
        .preco small { font-size: 0.9rem; color: #888; }
        .lista { list-style: none; margin-bottom: 20px; }
        .lista li {
            padding: 7px 0;
            font-size: 0.88rem;
            color: #ccc;
            border-bottom: 1px solid #222;
        }
        .btn-plano {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            background: linear-gradient(135deg, #e74c3c, #ff6b35);
            color: #fff;
        }
        .btn-vip {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #111;
        }

        /* MODAL */
        .modal-fundo {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            z-index: 9999;
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
            padding: 16px;
        }
        .modal-fundo.aberto {
            display: flex;
        }
        .modal-caixa {
            background: #1a1a1a;
            border-radius: 20px;
            padding: 28px 20px;
            width: 100%;
            max-width: 480px;
            margin: 10px 0 30px;
            border: 2px solid #e74c3c;
            position: relative;
        }
        .modal-fechar {
            position: absolute;
            top: 10px; right: 14px;
            background: none;
            border: none;
            color: #888;
            font-size: 1.6rem;
            cursor: pointer;
        }
        .modal-titulo {
            text-align: center;
            color: #e74c3c;
            margin-bottom: 18px;
            font-size: 1.3rem;
        }
        .resumo {
            background: #222;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid #333;
        }
        .resumo h3 { color: #ffd700; margin-bottom: 6px; }
        .resumo .desc { color: #aaa; font-size: 0.85rem; }
        .resumo .valor { font-size: 1.5rem; font-weight: 900; margin-top: 8px; }
        .campo { margin-bottom: 14px; }
        .campo label {
            display: block;
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .campo input {
            width: 100%;
            padding: 12px 14px;
            background: #222;
            border: 1px solid #444;
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
        }
        .campo input:focus {
            outline: none;
            border-color: #e74c3c;
        }
        .erro {
            background: rgba(231,76,60,0.15);
            border: 1px solid #e74c3c;
            color: #ff6b6b;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 14px;
            font-size: 0.85rem;
            display: none;
        }
        .btn-pagar {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            background: linear-gradient(135deg, #27ae60, #00e676);
            color: #fff;
            margin-top: 10px;
        }
        .btn-pagar:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .rodape-seguro {
            text-align: center;
            font-size: 0.7rem;
            color: #555;
            margin-top: 14px;
        }

        @media (min-width: 600px) { .planos { grid-template-columns: 1fr 1fr; } }
        @media (min-width: 900px) { .planos { grid-template-columns: repeat(4, 1fr); } .conteudo { max-width: 1100px; } }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="topo">
        <a href="index.html">← Cardápio</a>
        <h1>🍕 Clube da Pizza</h1>
    </div>
